<!doctype html>
<html lang="ja">
<head>

<title>Eigo No Sensei — Digital Card</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#f5f1e8;font-family:Arial,"Yu Gothic",Meiryo,sans-serif}
.wrap{max-width:760px;margin:auto;padding:14px}
.card{position:relative;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 5px 24px rgba(0,0,0,.14)}
.art{display:block;width:100%;height:auto}
.hotspot{position:absolute;display:block;border-radius:14px;background:transparent;text-decoration:none;-webkit-tap-highlight-color:rgba(18,63,115,.18)}
.hotspot:active{background:rgba(255,255,255,.12)}
.call{left:2.8%;right:50.2%;top:79.0%;height:7.4%}
.email{left:50.8%;right:2.8%;top:79.0%;height:7.4%}
.web{left:2.8%;right:50.2%;top:87.0%;height:7.4%}
.contact{left:50.8%;right:2.8%;top:87.0%;height:7.4%}
.note{text-align:center;font-size:13px;color:#666;padding:14px 12px 18px}
@media(max-width:430px){.wrap{padding:8px}.note{font-size:12px;padding-bottom:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <img class="art" src="eigo-no-sensei-card-art.png" alt="Eigo No Sensei — Private English Lessons with Terry">
    <a class="hotspot call" href="tel:+817017461843" aria-label="電話する"></a>
    <a class="hotspot email" href="mailto:terry@eigo-no-sensei.com" aria-label="メールする"></a>
    <a class="hotspot web" href="https://eigo-no-sensei.com/" aria-label="ウェブサイトを見る"></a>
    <a class="hotspot contact" href="Eigo_No_Sensei_Terry.vcf" aria-label="連絡先に追加"></a>
  </div>
  <div class="note">Eigo No Sensei · 英語の先生 · 町田・相模原</div>
</div>
</body>
</html>
